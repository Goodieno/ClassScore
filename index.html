<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>학급 점수판 (교사용)</title>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<style>
body {
  font-family: Arial, sans-serif;
  margin: 0;
  padding: 16px;
  background: #f9fafb;
}

h1, h2 {
  margin-bottom: 14px;
}

button {
  cursor: pointer;
}

button.link-btn {
  background: none;
  border: none;
  color: #2563eb;
  font-size: 18px;
  padding: 6px 0;
}

button.link-btn:hover {
  text-decoration: underline;
}

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
  gap: 14px;
}

.card {
  background: #fff;
  border: 1px solid #ddd;
  border-radius: 12px;
  padding: 14px;
}

.card-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 18px;
  margin-bottom: 8px;
}

.class-name {
  font-weight: bold;
  color: #2563eb;
}

.score-area {
  display: flex;
  align-items: center;
  gap: 6px;
  font-weight: bold;
}

.badge {
  font-size: 18px;
}

.controls {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  margin-top: 8px;
}

.controls input {
  grid-column: span 2;
  padding: 8px;
  font-size: 16px;
}

.controls button {
  padding: 10px;
  border: none;
  color: #fff;
  font-weight: bold;
  border-radius: 8px;
  font-size: 16px;
}

.btn-add { background: #16a34a; }
.btn-take { background: #dc2626; }
.btn-undo {
  grid-column: span 2;
  background: #6b7280;
}

.reasons-wrapper {
  margin-top: 10px;
  max-height: 160px;
  overflow-y: auto;
  border: 1px solid #ddd;
  padding: 8px;
  border-radius: 8px;
  background: #f9fafb;
}

.reason-entry {
  font-size: 14px;
  margin-bottom: 6px;
  padding-bottom: 6px;
  border-bottom: 1px dashed #ccc;
}

.reason-entry:last-child {
  border-bottom: none;
}

.reason-time {
  font-size: 12px;
  color: #555;
}

.admin-link {
  position: fixed;
  bottom: 10px;
  right: 10px;
  opacity: 0.7;
}

@media (max-width: 480px) {
  .card-header {
    font-size: 16px;
  }
}
</style>
</head>

<body>

<div id="home">
  <h1>학년 선택</h1>
  <ul id="grade-links"></ul>
</div>

<div id="view"></div>

<div class="admin-link">
  <button class="link-btn" id="admin-link">⚙️ Admin</button>
</div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyAfFbHdfoXoOLw7rD-nd8HPSaZR6OBBYf8",
  authDomain: "tally-v-2.firebaseapp.com",
  databaseURL: "https://tally-v-2-default-rtdb.firebaseio.com",
  projectId: "tally-v-2",
  storageBucket: "tally-v-2.appspot.com",
  messagingSenderId: "193194015446",
  appId: "1:193194015446:web:41f010ef36a74df776a777"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();

let grades = {};
let currentGrade = null;

db.ref("grades").on("value", snap => {
  grades = snap.val() || {};
  if (currentGrade) renderGrade(currentGrade);
  else renderHome();
});

function renderHome() {
  currentGrade = null;
  document.getElementById("home").style.display = "block";
  document.getElementById("view").innerHTML = "";

  const ul = document.getElementById("grade-links");
  ul.innerHTML = "";

  for (const grade in grades) {
    const li = document.createElement("li");
    li.innerHTML = `<button class="link-btn" data-grade="${grade}">${grade}</button>`;
    ul.appendChild(li);
  }
}

function renderGrade(gradeName) {
  currentGrade = gradeName;
  document.getElementById("home").style.display = "none";

  const view = document.getElementById("view");
  view.innerHTML = `
    <button class="link-btn" id="back-home">← 돌아가기</button>
    <h2>${gradeName} 점수판</h2>
    <div class="grid"></div>
  `;

  const grid = view.querySelector(".grid");
  const classes = grades[gradeName];

  const maxScore = Math.max(...Object.values(classes).map(c => c.points || 0));
  const leaders = Object.values(classes).filter(c => (c.points || 0) === maxScore && maxScore > 0).length;

  for (const className in classes) {
    const data = classes[className];
    const isLeader = data.points === maxScore && maxScore > 0;
    const badge = isLeader ? (leaders > 1 ? "🤝" : "🥇") : "";

    const card = document.createElement("div");
    card.className = "card";
    card.innerHTML = `
      <div class="card-header">
        <span class="class-name">${className}</span>
        <div class="score-area">
          <span>${data.points || 0}</span>
          <span class="badge">${badge}</span>
        </div>
      </div>
      <div class="reasons-wrapper">
        ${(data.reasons || []).slice().reverse().map(r =>
          `<div class="reason-entry">
            <div>${r.text}</div>
            <div class="reason-time">${r.time}</div>
          </div>`
        ).join("")}
      </div>
    `;
    grid.appendChild(card);
  }
}

document.addEventListener("click", e => {
  if (e.target.dataset.grade) renderGrade(e.target.dataset.grade);
  if (e.target.id === "back-home") renderHome();
});
</script>

</body>
</html>
