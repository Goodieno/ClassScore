<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>학급 점수판 (교사용)</title>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<style>
body {
  font-family: Arial, sans-serif;
  padding: 12px;
  background: #f4f6f8;
  text-align: center;
}

h1, h2 {
  margin-bottom: 14px;
}

ul {
  list-style: none;
  padding: 0;
}

li {
  margin: 12px 0;
}

button {
  cursor: pointer;
}

button.link-btn {
  background: none;
  border: none;
  color: #2563eb;
  font-size: 20px;
  font-weight: bold;
}

button.link-btn:hover {
  text-decoration: underline;
}

.panel {
  background: #fff;
  border-radius: 16px;
  padding: 16px;
  max-width: 960px;
  margin: 0 auto 16px auto;
  box-shadow: 0 6px 18px rgba(0,0,0,0.08);
}

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
  gap: 14px;
}

.card {
  background: #fff;
  border: 1px solid #ddd;
  border-radius: 14px;
  padding: 14px;
  text-align: left;
}

.card-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.class-name {
  font-weight: bold;
  font-size: 18px;
  color: #2563eb;
}

.points {
  font-size: 20px;
  font-weight: bold;
  color: #14532d;
}

.controls {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  margin-top: 10px;
}

.controls input {
  grid-column: span 2;
  padding: 10px;
  font-size: 16px;
}

.controls button {
  padding: 12px;
  font-size: 16px;
  font-weight: bold;
  border-radius: 10px;
  border: none;
  color: #fff;
}

.btn-add { background: #16a34a; }
.btn-take { background: #dc2626; }
.btn-undo {
  grid-column: span 2;
  background: #6b7280;
}

.reasons-wrapper {
  margin-top: 12px;
  max-height: 160px;
  overflow-y: auto;
  border: 1px solid #ddd;
  padding: 10px;
  border-radius: 10px;
  background: #f9fafb;
}

.reason-entry {
  font-size: 14px;
  margin-bottom: 8px;
  padding-bottom: 8px;
  border-bottom: 1px dashed #ccc;
}

.reason-entry:last-child {
  border-bottom: none;
}

.reason-time {
  font-size: 12px;
  color: #555;
}

.reason-add { color: #14532d; font-weight: bold; }
.reason-take { color: #b91c1c; font-weight: bold; }

.admin-link {
  position: fixed;
  bottom: 10px;
  right: 10px;
  opacity: 0.8;
}

.admin-link button {
  font-size: 14px;
  color: #555;
}
</style>
</head>
<body>

<div id="home" class="panel">
  <h1>학년 선택</h1>
  <ul id="grade-links"></ul>
</div>

<div id="view"></div>

<div class="admin-link">
  <button class="link-btn" id="admin-link">⚙️ Admin</button>
</div>

<script>
// Firebase config (UNCHANGED)
const firebaseConfig = {
  apiKey: "AIzaSyAfFbHdfoXoOLw7rD-nd8HPSaZR6OBBYf8",
  authDomain: "tally-v-2.firebaseapp.com",
  databaseURL: "https://tally-v-2-default-rtdb.firebaseio.com",
  projectId: "tally-v-2",
  storageBucket: "tally-v-2.appspot.com",
  messagingSenderId: "193194015446",
  appId: "1:193194015446:web:41f010ef36a74df776a777"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();

let grades = {};
let classCards = {};
let currentGrade = null;

/* ======================
   DATA LOAD
====================== */
function loadData() {
  db.ref("grades").on("value", snapshot => {
    grades = snapshot.val() || {};
    if (currentGrade) renderGrade(currentGrade, true);
    else renderHome();
  });
}

/* ======================
   HOME
====================== */
function renderHome() {
  currentGrade = null;
  document.getElementById("home").style.display = "block";
  document.getElementById("view").innerHTML = "";

  const ul = document.getElementById("grade-links");
  ul.innerHTML = "";

  for (const gradeName in grades) {
    const li = document.createElement("li");
    li.innerHTML = `<button class="link-btn" data-grade="${gradeName}">${gradeName}</button>`;
    ul.appendChild(li);
  }
}

/* ======================
   GRADE VIEW
====================== */
function renderGrade(gradeName, isUpdate=false) {
  currentGrade = gradeName;
  const view = document.getElementById("view");

  if (!isUpdate) {
    document.getElementById("home").style.display = "none";
    view.innerHTML = `
      <div class="panel">
        <button class="link-btn" id="back-home">← 돌아가기</button>
        <h2>${gradeName} 점수판</h2>
        <div class="grid"></div>
      </div>
    `;
    classCards = {};
  }

  const grid = view.querySelector(".grid");
  const classes = grades[gradeName];

  for (const className in classes) {
    const data = classes[className];

    if (!classCards[className]) {
      const card = document.createElement("div");
      card.className = "card";
      card.innerHTML = `
        <div class="card-header">
          <span class="class-name">${className}</span>
          <span class="points">${data.points || 0}</span>
        </div>
        <div class="controls">
          <input placeholder="이유 입력" maxlength="30">
          <button class="btn-add">+2</button>
          <button class="btn-take">-1</button>
          <button class="btn-undo" disabled>↩ Undo</button>
        </div>
        <div class="reasons-wrapper"></div>
      `;
      grid.appendChild(card);

      const input = card.querySelector("input");
      const scoreEl = card.querySelector(".points");
      const history = card.querySelector(".reasons-wrapper");
      const undoBtn = card.querySelector(".btn-undo");
      let lastEntry = null;

      function renderReasons() {
        history.innerHTML = "";
        (data.reasons || []).slice().reverse().forEach(r => {
          const div = document.createElement("div");
          div.className = "reason-entry";
          div.innerHTML = `<div>${r.text}</div><div class="reason-time">${r.time}</div>`;
          history.appendChild(div);
        });
      }

      function save() {
        db.ref(`grades/${gradeName}/${className}`).update({
          points: data.points,
          reasons: data.reasons
        });
      }

      function add(delta, label) {
        const text = input.value.trim();
        if (!text) return;

        const entry = {
          text: `${label}: ${text}`,
          delta,
          time: new Date().toLocaleString("ko-KR")
        };

        data.points = (data.points || 0) + delta;
        data.reasons = data.reasons || [];
        data.reasons.push(entry);
        lastEntry = entry;

        scoreEl.textContent = data.points;
        undoBtn.disabled = false;
        input.value = "";
        renderReasons();
        save();
      }

      card.querySelector(".btn-add").onclick = () => add(2, "+2점");
      card.querySelector(".btn-take").onclick = () => add(-1, "-1점");

      undoBtn.onclick = () => {
        if (!lastEntry) return;
        data.points -= lastEntry.delta;
        data.reasons.pop();
        lastEntry = null;
        undoBtn.disabled = true;
        scoreEl.textContent = data.points;
        renderReasons();
        save();
      };

      renderReasons();
      classCards[className] = true;
    } else {
      grid.querySelectorAll(".card").forEach(card => {
        card.querySelector(".points").textContent = data.points || 0;
      });
    }
  }
}

/* ======================
   ADMIN
====================== */
function checkAdminPassword() {
  const pw = prompt("관리자 비밀번호:");
  if (pw === "delete") renderHome();
  else if (pw !== null) alert("비밀번호 오류");
}

/* ======================
   EVENTS
====================== */
document.addEventListener("click", e => {
  if (e.target.dataset.grade) renderGrade(e.target.dataset.grade);
  if (e.target.id === "back-home") renderHome();
  if (e.target.id === "admin-link") checkAdminPassword();
});

loadData();
</script>
</body>
</html>
