<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>Class Tally</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #111;
    color: white;
}

/* ===== HEADER ===== */
header {
    text-align: center;
    padding: 20px;
    font-size: 28px;
    font-weight: bold;
}

/* ===== LINKS ===== */
a {
    color: #00c8ff;
    text-decoration: none;
}
a:hover {
    text-decoration: underline;
}

/* ===== RANKING ===== */
.rank {
    font-size: 32px;
    font-weight: bold;
    text-align: center;
    margin: 10px 0;
    text-shadow: -2px -2px 0 #000,
                  2px -2px 0 #000,
                 -2px  2px 0 #000,
                  2px  2px 0 #000;
}
.gold { color: gold; }
.silver { color: silver; }
.bronze { color: #cd7f32; }

/* ===== CLASS ROW ===== */
.class-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: #222;
    margin: 8px;
    padding: 12px;
    border-radius: 10px;
}

.points {
    font-size: 24px;
    font-weight: bold;
    color: yellow;
    text-shadow: -2px -2px 0 #000,
                  2px -2px 0 #000,
                 -2px  2px 0 #000,
                  2px  2px 0 #000;
}

/* ===== REASONS ===== */
.reasons {
    background: #000;
    margin: 0 8px 10px 8px;
    padding: 8px;
    border-radius: 8px;
    max-height: 90px;
    overflow-y: auto;
    font-size: 14px;
}

/* ===== ADMIN ===== */
.admin-btn {
    margin: 20px auto;
    display: block;
    padding: 10px 20px;
    font-size: 16px;
    cursor: pointer;
}

#adminPanel {
    display: none;
    padding: 20px;
}

.admin-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 15px;
}

.admin-card {
    background: #222;
    padding: 15px;
    border-radius: 12px;
    text-align: center;
}

.delete-btn {
    margin-top: 10px;
    background: red;
    color: white;
    border: none;
    padding: 8px 12px;
    cursor: pointer;
    border-radius: 6px;
}
</style>
</head>

<body>

<header>학급 점수판</header>

<div id="ranking">
    <div class="rank gold">🥇 1위</div>
    <div class="rank silver">🥈 2위</div>
    <div class="rank bronze">🥉 3위</div>
</div>

<div id="classes"></div>

<button class="admin-btn" onclick="adminLogin()">관리자</button>

<div id="adminPanel">
    <h2>Admin Panel</h2>
    <div class="admin-grid" id="adminGrid"></div>
</div>

<script>
/* ===== FIREBASE CONFIG ===== */
const firebaseConfig = {
    apiKey: "YOUR_API_KEY",
    authDomain: "YOUR_DOMAIN",
    databaseURL: "YOUR_DB_URL",
    projectId: "YOUR_PROJECT_ID",
    storageBucket: "YOUR_BUCKET",
    messagingSenderId: "YOUR_SENDER_ID",
    appId: "YOUR_APP_ID"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();

/* ===== DATA ===== */
const grades = Array.from({ length: 6 }, (_, g) => {
    return {
        grade: `${g + 1}학년`,
        classes: Array.from({ length: 9 }, (_, c) => `${g + 1}학년 ${c + 1}반`)
    };
});

/* ===== RENDER ===== */
function renderClasses() {
    const container = document.getElementById("classes");
    container.innerHTML = "";

    grades.forEach(g => {
        g.classes.forEach(cls => {
            const row = document.createElement("div");
            row.className = "class-row";

            row.innerHTML = `
                <div>${cls}</div>
                <div class="points" id="${cls}-points">0</div>
            `;
            container.appendChild(row);

            const reasons = document.createElement("div");
            reasons.className = "reasons";
            reasons.id = `${cls}-reasons`;
            reasons.innerText = "사유 없음";
            container.appendChild(reasons);
        });
    });
}

/* ===== ADMIN ===== */
function adminLogin() {
    const pw = prompt("관리자 비밀번호 입력");
    if (pw === "admin123") {
        document.getElementById("adminPanel").style.display = "block";
        renderAdmin();
    } else {
        alert("비밀번호가 틀렸습니다.");
    }
}

function renderAdmin() {
    const grid = document.getElementById("adminGrid");
    grid.innerHTML = "";

    grades.forEach(g => {
        g.classes.forEach(cls => {
            const card = document.createElement("div");
            card.className = "admin-card";
            card.innerHTML = `
                <div>${cls}</div>
                <button class="delete-btn" onclick="deleteClass('${cls}')">삭제</button>
            `;
            grid.appendChild(card);
        });
    });
}

function deleteClass(cls) {
    if (!confirm(`${cls}을(를) 삭제하시겠습니까?`)) return;

    document.getElementById(`${cls}-points`)?.parentElement.remove();
    document.getElementById(`${cls}-reasons`)?.remove();
    alert(`${cls} 삭제 완료`);
}

/* ===== INIT ===== */
renderClasses();
</script>

</body>
</html>
