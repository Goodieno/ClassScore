<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>학급 점수판 (교사용)</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<style>
body{
  font-family:Arial,sans-serif;
  margin:0;
  background:#f3f4f6;
  text-align:center;
}

h1{
  font-size:1.9em;
  margin:24px 0 16px;
}

h2{margin:12px 0;}

.panel{
  background:#fff;
  border-radius:14px;
  padding:20px;
  max-width:720px;
  margin:20px auto;
  box-shadow:0 4px 14px rgba(0,0,0,.08);
}

/* ===== HOME PAGE FIX ===== */

#grade-links{
  max-width:420px;
  margin:0 auto;
  text-align:center;
}

#grade-links li{
  display:flex;
  justify-content:center;
  align-items:center;
  gap:10px;
  padding:14px 0;
  border-bottom:1px solid #e5e7eb;
}

#grade-links li:last-child{
  border-bottom:none;
}

.grade-btn{
  font-size:20px;
  font-weight:bold;
  background:none;
  border:none;
  color:#2563eb;
  cursor:pointer;
}

.leader{
  font-size:14px;
  font-weight:bold;
  white-space:nowrap;
}

.leader.win{color:#b45309;}
.leader.tie{color:#7c3aed;}

/* ===== CLASS VIEW (UNCHANGED) ===== */

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
  gap:14px;
}

.card{
  background:#fff;
  border-radius:14px;
  padding:12px;
  box-shadow:0 4px 10px rgba(0,0,0,.05);
}

.class-name{font-weight:bold;color:#2563eb;}
.points{float:right;font-weight:bold;}

.controls{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:6px;
  margin-top:8px;
}

.controls input{
  grid-column:span 2;
  padding:8px;
  border-radius:8px;
  border:1px solid #ccc;
}

.controls button{
  font-weight:bold;
  color:#fff;
  border:none;
  border-radius:8px;
  padding:8px;
}

.btn-add{background:#16a34a;}
.btn-take{background:#dc2626;}
.btn-undo{grid-column:span 2;background:#6b7280;}

.reasons-wrapper{
  margin-top:10px;
  max-height:160px;
  overflow-y:auto;
  border:1px solid #ddd;
  border-radius:10px;
  padding:8px;
  background:#f9fafb;
  text-align:left;
}

.reason-entry{
  font-size:14px;
  margin-bottom:6px;
  padding-bottom:6px;
  border-bottom:1px dashed #ccc;
}
.reason-entry:last-child{border-bottom:none;}

.reason-add{color:#15803d;font-weight:bold;}
.reason-take{color:#b91c1c;font-weight:bold;}
.reason-time{font-size:12px;color:#555;}

.link-btn{
  background:none;
  border:none;
  color:#2563eb;
  font-size:16px;
  cursor:pointer;
}

.admin-link{
  position:fixed;
  bottom:10px;
  right:10px;
  opacity:.7;
}
</style>
</head>

<body>

<div id="home" class="panel">
  <h1>학년 선택</h1>
  <ul id="grade-links"></ul>
</div>

<div id="view"></div>

<div class="admin-link">
  <button class="link-btn" id="admin-link">⚙ Admin</button>
</div>

<script>
const firebaseConfig={
  apiKey:"AIzaSyAfFbHdfoXoOLw7rD-nd8HPSaZR6OBBYf8",
  authDomain:"tally-v-2.firebaseapp.com",
  databaseURL:"https://tally-v-2-default-rtdb.firebaseio.com",
  projectId:"tally-v-2",
  storageBucket:"tally-v-2.appspot.com",
  messagingSenderId:"193194015446",
  appId:"1:193194015446:web:41f010ef36a74df776a777"
};

firebase.initializeApp(firebaseConfig);
const db=firebase.database();

let grades={},currentGrade=null,classCards={};

db.ref("grades").on("value",snap=>{
  grades=snap.val()||{};
  currentGrade?renderGrade(currentGrade,true):renderHome();
});

function renderHome(){
  currentGrade=null;
  document.getElementById("home").style.display="block";
  document.getElementById("view").innerHTML="";
  const ul=document.getElementById("grade-links");
  ul.innerHTML="";

  for(const g in grades){
    const classes=grades[g];
    const max=Math.max(...Object.values(classes).map(c=>c.points||0));
    const leaders=Object.entries(classes).filter(([_,c])=>c.points===max && max>0);

    let badge="";
    if(leaders.length===1){
      badge=`<span class="leader win">👑 ${leaders[0][0]}</span>`;
    }else if(leaders.length>1){
      badge=`<span class="leader tie">🤝 ${leaders.map(l=>l[0]).join(", ")}</span>`;
    }

    const li=document.createElement("li");
    li.innerHTML=`<button class="grade-btn" data-grade="${g}">${g}</button>${badge}`;
    ul.appendChild(li);
  }
}

/* ===== EVERYTHING BELOW UNCHANGED ===== */

function renderGrade(g,isUpdate=false){
  currentGrade=g;
  const view=document.getElementById("view");

  if(!isUpdate){
    document.getElementById("home").style.display="none";
    view.innerHTML=`
      <div class="panel">
        <button class="link-btn" id="back-home">← 돌아가기</button>
        <h2>${g} 점수판</h2>
        <div class="grid"></div>
      </div>`;
    classCards={};
  }

  const grid=view.querySelector(".grid");
  const classes=grades[g];

  for(const c in classes){
    if(classCards[c]) continue;
    const d=classes[c];

    const card=document.createElement("div");
    card.className="card";
    card.innerHTML=`
      <div>
        <span class="class-name">${c}</span>
        <span class="points">${d.points||0}</span>
      </div>
      <div class="controls">
        <input placeholder="이유 입력" maxlength="30">
        <button class="btn-add">+2</button>
        <button class="btn-take">-1</button>
        <button class="btn-undo" disabled>↩ Undo</button>
      </div>
      <div class="reasons-wrapper"></div>
    `;
    grid.appendChild(card);

    const input=card.querySelector("input");
    const score=card.querySelector(".points");
    const history=card.querySelector(".reasons-wrapper");
    const undo=card.querySelector(".btn-undo");
    let last=null;

    function draw(){
      history.innerHTML="";
      (d.reasons||[]).slice().reverse().forEach(r=>{
        const div=document.createElement("div");
        div.className=`reason-entry ${r.delta>0?"reason-add":"reason-take"}`;
        div.innerHTML=`<div>${r.text}</div><div class="reason-time">${r.time}</div>`;
        history.appendChild(div);
      });
    }

    function add(delta,label){
      if(!input.value.trim())return;
      const entry={text:`${label}: ${input.value}`,delta,time:new Date().toLocaleString("ko-KR")};
      d.points=(d.points||0)+delta;
      d.reasons=d.reasons||[];
      d.reasons.push(entry);
      last=entry;
      score.textContent=d.points;
      undo.disabled=false;
      input.value="";
      draw();
      db.ref(`grades/${g}/${c}`).update(d);
    }

    card.querySelector(".btn-add").onclick=()=>add(2,"+2점");
    card.querySelector(".btn-take").onclick=()=>add(-1,"-1점");
    undo.onclick=()=>{
      if(!last)return;
      d.points-=last.delta;
      d.reasons.pop();
      last=null;
      undo.disabled=true;
      score.textContent=d.points;
      draw();
      db.ref(`grades/${g}/${c}`).update(d);
    };

    draw();
    classCards[c]=true;
  }
}

function renderAdmin(){
  document.getElementById("home").style.display="none";
  const view=document.getElementById("view");
  view.innerHTML=`<div class="panel"><button class="link-btn" id="back-home">← 돌아가기</button><h2>관리자 패널</h2></div>`;
  for(const g in grades){
    const btn=document.createElement("button");
    btn.className="link-btn";
    btn.textContent=`${g} 점수 초기화`;
    btn.onclick=()=>{
      if(!confirm(`${g} 전체 초기화?`))return;
      for(const c in grades[g]){
        db.ref(`grades/${g}/${c}`).update({points:0,reasons:[]});
      }
      alert("완료");
      renderHome();
    };
    view.appendChild(btn);
    view.appendChild(document.createElement("br"));
  }
}

document.addEventListener("click",e=>{
  if(e.target.dataset.grade) renderGrade(e.target.dataset.grade);
  if(e.target.id==="back-home") renderHome();
  if(e.target.id==="admin-link"){
    const pw=prompt("관리자 비밀번호:");
    if(pw==="delete") renderAdmin();
    else if(pw!==null) alert("비밀번호 오류");
  }
});
</script>

</body>
</html>
