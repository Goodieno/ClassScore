<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>5학년 아파트 투표</title>

<style>
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #f2f4f8;
    margin: 0;
    padding: 0;
  }

  h1 {
    text-align: center;
    margin-top: 20px;
  }

  .warning {
    text-align: center;
    color: red;
    font-weight: bold;
    margin-bottom: 10px;
  }

  .container {
    max-width: 480px;
    margin: 0 auto;
    background: white;
    border-radius: 16px;
    padding: 16px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.1);
  }

  .class-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin: 8px 0;
  }

  button {
    padding: 10px 14px;
    border: none;
    border-radius: 10px;
    font-size: 14px;
    cursor: pointer;
  }

  .admin-btn {
    width: 100%;
    margin-top: 16px;
    background: #222;
    color: white;
  }

  /* ADMIN */
  .hidden { display: none; }

  .admin-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
    margin-top: 16px;
  }

  .admin-card {
    background: #f8f9fc;
    border-radius: 12px;
    padding: 12px;
    text-align: center;
    box-shadow: inset 0 0 0 1px #ddd;
  }

  .delete-btn {
    background: #e74c3c;
    color: white;
    margin-top: 8px;
    width: 100%;
  }

  @media (max-width: 480px) {
    .container { margin: 12px; }
  }
</style>
</head>
<body>

<h1>5학년 아파트 투표</h1>
<div class="warning">* 교사당 한 번만 투표해 주세요 *</div>

<div class="container" id="mainPage">
  <div id="classList"></div>
  <button class="admin-btn" onclick="openAdmin()">ADMIN</button>
</div>

<div class="container hidden" id="adminPage">
  <h2 style="text-align:center;">관리자 페이지</h2>
  <input id="adminPass" type="password" placeholder="Password" style="width:100%;padding:10px;border-radius:10px;" />
  <button class="admin-btn" onclick="unlockAdmin()">확인</button>

  <div id="adminControls" class="hidden">
    <div class="admin-grid" id="adminGrid"></div>
  </div>
</div>

<script>
const CLASSES = Array.from({ length: 9 }, (_, i) => `Class ${i + 1}`);
let scores = JSON.parse(localStorage.getItem('scores')) || {};

CLASSES.forEach(c => { if (!(c in scores)) scores[c] = 0; });

function renderClasses() {
  const list = document.getElementById('classList');
  list.innerHTML = '';
  CLASSES.forEach(c => {
    const row = document.createElement('div');
    row.className = 'class-row';
    row.innerHTML = `<span>${c}</span><strong>${scores[c]}</strong>`;
    list.appendChild(row);
  });
}

function openAdmin() {
  document.getElementById('mainPage').classList.add('hidden');
  document.getElementById('adminPage').classList.remove('hidden');
}

function unlockAdmin() {
  const pass = document.getElementById('adminPass').value;
  if (pass !== 'delete') {
    alert('비밀번호가 틀렸습니다');
    return;
  }

  document.getElementById('adminControls').classList.remove('hidden');
  renderAdminGrid();
}

function renderAdminGrid() {
  const grid = document.getElementById('adminGrid');
  grid.innerHTML = '';

  CLASSES.forEach(c => {
    const card = document.createElement('div');
    card.className = 'admin-card';
    card.innerHTML = `
      <strong>${c}</strong><br />
      점수: ${scores[c]}
      <button class="delete-btn" onclick="confirmDelete('${c}')">삭제</button>
    `;
    grid.appendChild(card);
  });
}

function confirmDelete(cls) {
  if (!confirm(`${cls}의 점수를 삭제하시겠습니까?`)) return;
  scores[cls] = 0;
  localStorage.setItem('scores', JSON.stringify(scores));
  renderAdminGrid();
  renderClasses();
}

renderClasses();
</script>

</body>
</html>
